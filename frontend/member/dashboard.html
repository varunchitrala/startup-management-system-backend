<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Portal | SUN Nexus Solution</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    :root {
      /* --- SUN NEXUS PALETTE --- */
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: #e0e7ff;
      
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      
      --radius-md: 12px;
      --shadow-soft: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      
      --font-main: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-body);
      font-family: var(--font-main);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    /* --- NAVBAR --- */
    .navbar-custom {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1.5rem;
      box-shadow: var(--shadow-soft);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-icon {
      width: 32px; height: 32px;
      background: var(--primary);
      color: white;
      border-radius: 8px;
      display: grid; place-items: center;
    }

    /* --- LAYOUT --- */
    .container-custom {
      max-width: 1100px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }

    /* --- PRO CARDS --- */
    .card-pro {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-soft);
      height: 100%;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
    }
    
    .card-header-pro {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      background: #fcfcfc;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-body-pro {
      padding: 1.5rem;
      flex: 1;
    }

    /* --- ELEMENTS --- */
    .status-display {
      background: var(--bg-body);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border-color);
    }

    .form-control, .form-select {
      border-radius: 8px;
      border: 1px solid var(--border-color);
      padding: 0.75rem;
      font-size: 0.95rem;
    }
    
    .form-control:focus, .form-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .btn {
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-weight: 500;
    }
    
    .btn-primary { background-color: var(--primary); border-color: var(--primary); }
    .btn-primary:hover { background-color: var(--primary-hover); }

    /* --- ROADMAP LIST --- */
    .list-group-item {
      border: none;
      border-bottom: 1px solid var(--border-color);
      padding: 1rem;
      font-size: 0.9rem;
    }
    .list-group-item:last-child { border-bottom: none; }

  </style>
</head>

<body>

  <nav class="navbar-custom d-flex justify-content-between align-items-center">
    <div class="brand-text d-flex align-items-center">
      <div class="brand-icon">
        <i class="bi bi-grid-3x3-gap-fill"></i>
      </div>
      <div class="d-flex flex-column ms-2" style="line-height: 1.1;">
        <span class="fw-bold text-dark" style="letter-spacing: -0.01em;">SUN Nexus</span>
        <span class="text-muted text-uppercase fw-bold" style="font-size: 0.6rem; letter-spacing: 0.1em;">Member Console</span>
      </div>
    </div>

    <div class="d-flex align-items-center gap-3">
      <div class="d-flex align-items-center gap-2">
        <div class="rounded-circle bg-primary-subtle text-primary border border-primary-subtle d-flex align-items-center justify-content-center fw-bold" style="width: 36px; height: 36px; font-size: 12px;">EM</div>
        <div class="d-none d-md-block lh-1 text-end">
          <div class="fw-bold text-dark" style="font-size: 0.85rem;">Team Member</div>
          <div class="text-muted" style="font-size: 0.7rem;">Staff</div>
        </div>
      </div>
      <div class="mx-1" style="height: 24px; width: 1px; background: #e2e8f0;"></div>
      <button class="btn btn-outline-danger btn-sm border-0 bg-danger-subtle text-danger fw-medium" onclick="logout()" style="font-size: 0.85rem;">
        <i class="bi bi-box-arrow-right me-1"></i> Logout
      </button>
    </div>
  </nav>

  <div class="container-custom">

    <div class="d-flex flex-column mb-4">
      <span class="text-uppercase text-muted fw-bold" style="font-size: 0.75rem; letter-spacing: 0.05em;">Overview</span>
      <h3 id="welcomeText" class="fw-bold text-dark m-0">Member Dashboard</h3>
    </div>

    <div class="row g-4 mb-4">
      
      <div class="col-lg-5">
        <div class="card-pro h-100">
          <div class="card-header-pro">
            <i class="bi bi-clock text-primary"></i> Attendance Tracker
          </div>
          <div class="card-body-pro d-flex flex-column">
            
            <div class="status-display">
              <span class="text-muted text-uppercase fw-bold small d-block mb-1">Current State</span>
              <div id="statusText" class="fs-4 fw-bold text-dark">Status: -</div>
            </div>

            <div class="d-grid gap-3">
              <button id="checkInBtn" class="btn btn-success py-2 shadow-sm">
                <i class="bi bi-check-circle-fill me-2"></i> Check In
              </button>
              <button id="checkOutBtn" class="btn btn-outline-danger py-2">
                <i class="bi bi-stop-circle me-2"></i> Check Out
              </button>
            </div>

            <div id="message" class="mt-3 text-center small fw-medium text-primary"></div>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card-pro h-100">
          <div class="card-header-pro justify-content-between">
            <span><i class="bi bi-file-earmark-text text-primary"></i> Work Report</span>
            <span class="badge bg-light text-dark border">Today</span>
          </div>
          <div class="card-body-pro">
            <h5 id="projectTitle" class="mb-3 text-primary fw-bold fs-6"></h5>
            
            <label class="form-label text-muted small fw-bold">ACTIVITY LOG</label>
            <textarea
              id="memberWorkDone"
              class="form-control mb-3"
              rows="5"
              placeholder="• Describe task 1&#10;• Describe task 2"
            ></textarea>

            <div class="d-flex justify-content-between align-items-center mt-auto">
               <div id="memberWorkMessage" class="small text-muted"></div>
               <button class="btn btn-primary" onclick="submitMemberDailyReport()">
                 Submit Report <i class="bi bi-arrow-right ms-1"></i>
               </button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <div class="card-pro">
      <div class="card-header-pro">
        <i class="bi bi-map text-primary"></i> Project Context
      </div>
      <div class="card-body-pro">
        <div class="row">
          <div class="col-md-4 border-end">
            <label class="form-label text-muted small fw-bold">SELECT PROJECT</label>
            <select id="memberProjectSelect" class="form-select mb-3">
              <option value="">Select Project</option>
            </select>
            <div class="text-muted small p-2 bg-light rounded">
              <i class="bi bi-info-circle me-1"></i> Select a project to view your team's progress and roadmap milestones.
            </div>
          </div>
          
          <div class="col-md-8 ps-md-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="fw-bold small text-dark">Completion Status</span>
              <span class="badge bg-primary-subtle text-primary rounded-pill">Live</span>
            </div>
            
            <div class="progress mb-4" style="height: 10px;">
              <div
                id="memberProgressBar"
                class="progress-bar bg-primary progress-bar-striped progress-bar-animated"
                role="progressbar"
                style="width: 0%"
              ></div>
            </div>

            <label class="form-label text-muted small fw-bold mb-3">ROADMAP STEPS</label>
            <div class="border rounded bg-white overflow-hidden">
              <ul id="memberRoadmapSteps" class="list-group list-group-flush">
                <li class="list-group-item text-muted text-center py-4">No project selected</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card mt-4">
  <div class="card-body">

    <h5>Apply Leave</h5>

    <div class="row g-2">
      <div class="col-md-6">
        <label>From Date</label>
        <input type="date" id="leaveFromDate" class="form-control">
      </div>

      <div class="col-md-6">
        <label>To Date</label>
        <input type="date" id="leaveToDate" class="form-control">
      </div>
    </div>

    <div class="mt-3">
      <label>Reason</label>
      <textarea id="leaveReason" class="form-control" rows="3"></textarea>
    </div>

    <button class="btn btn-primary mt-3" onclick="applyLeave()">
      Submit Leave
    </button>

    <div id="leaveMessage" class="mt-2"></div>

  </div>
</div>


  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
